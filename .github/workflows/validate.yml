name: Validate rules

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Ensure generated files are current
        run: git diff --exit-code

  merge-automated-update:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'automation/update-public-rules')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge validated update and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REF_NAME" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            echo 'No open automated update PR found.' >&2
            exit 1
          fi
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
