name: Validate rules

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # The update workflow already dispatches an exact-commit validation and
    # waits for it before merging. Avoid a second pull_request run whose
    # result can be stale or misleading.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'automation/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Require a new generator version for generator changes
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="generator-v${version}"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            git diff --exit-code "$tag" -- package.json scripts
          fi
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Ensure generated files are current
        run: git diff --exit-code
