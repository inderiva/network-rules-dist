name: Update public rules

on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-public-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm run sync
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- vendor shadowrocket stash sing-box; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch='automation/update-public-rules'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git add vendor shadowrocket stash sing-box
          git commit -m 'chore: update public rules'
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

          pr_number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title 'chore: update public rules' \
              --body 'Automated public upstream refresh. Generated outputs are published only after validation succeeds.')"
            pr_number="${pr_url##*/}"
          fi

          head_sha="$(git rev-parse HEAD)"
          gh workflow run validate.yml --ref "$branch"

          run_id=''
          for attempt in $(seq 1 60); do
            run_id="$(gh run list \
              --workflow validate.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" \
              | head -n 1)"
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo 'The dispatched validation run did not appear.' >&2
            exit 1
          fi

          gh run watch "$run_id" --exit-status
          for attempt in $(seq 1 12); do
            if gh pr merge "$pr_number" --squash --delete-branch; then
              exit 0
            fi
            sleep 5
          done
          echo "Validated update PR #$pr_number could not be merged." >&2
          exit 1
