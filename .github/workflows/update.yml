name: Update public rules

on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run sync
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- vendor shadowrocket stash sing-box; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Commit updated rules
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor shadowrocket stash sing-box
          git commit -m 'chore: update public rules'
          git push
